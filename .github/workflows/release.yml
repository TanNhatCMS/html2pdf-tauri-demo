# Phat hanh: chay khi day tag v* (vi du v1.0.0)
# - job tools: build 2 exe cong cu (invoice-pdf bang Bun compile, weasyprint
#   freeze bang PyInstaller) cho tung OS + file .sha256
# - job app: build Tauri (kem bun runtime sidecar + Next standalone resources)
# - job publish-tools: gan 2 exe + sha256 vao cung ban Release de app tai
#   online o lan chay dau (RELEASE_BASE trong src-tauri/src/lib.rs)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tools:
    # Chi build Windows (user chot 2026-10-24). Muon mo lai Linux/macOS thi
    # them entry vao matrix include ben duoi nhu truoc.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: .exe
            bun_target: bun-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Build invoice-pdf (Bun compile)
        shell: bash
        working-directory: tools/invoice-pdf
        run: |
          bun install
          if [ -n "${{ matrix.bun_target }}" ]; then
            bun build src/cli.mjs --compile --target=${{ matrix.bun_target }} \
              --outfile "$GITHUB_WORKSPACE/dist-tools/invoice-pdf-${{ matrix.triple }}${{ matrix.ext }}"
          else
            bun build src/cli.mjs --compile \
              --outfile "$GITHUB_WORKSPACE/dist-tools/invoice-pdf-${{ matrix.triple }}${{ matrix.ext }}"
          fi

      # Windows: WeasyPrint can GTK/Pango DLL — cai qua MSYS2 truoc khi freeze.
      # Co y KHONG de continue-on-error: vong v1.0.1 cho thay freeze Windows
      # hong am tham khien release thieu weasyprint .exe ma job van xanh.
      # Tu nay hong la do CI ngay, kem buoc kiem chung PATH sach o duoi.
      - name: (Windows) Cai GTK/Pango qua MSYS2 cho WeasyPrint
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-pango mingw-w64-x86_64-cairo
            mingw-w64-x86_64-gdk-pixbuf2 mingw-w64-x86_64-libffi

      - name: Freeze WeasyPrint (PyInstaller)
        shell: bash
        env:
          # setup-msys2 khong cai mac dinh vao C:\msys64 ma vao thu muc tam
          # cua runner — truyen dung vi tri that cho build.sh, dung doan
          # /c/msys64 nua (do la ly do vong v1.0.3 fail nhanh o buoc nay).
          MSYS2_LOCATION: ${{ steps.msys2.outputs['msys2-location'] }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install pango cairo gdk-pixbuf libffi || true; fi
          bash tools/weasyprint-freeze/build.sh
          mkdir -p dist-tools
          cp "tools/weasyprint-freeze/dist/weasyprint${{ matrix.ext }}" \
             "dist-tools/weasyprint-${{ matrix.triple }}${{ matrix.ext }}" 2>/dev/null \
          || cp tools/weasyprint-freeze/dist/weasyprint \
             "dist-tools/weasyprint-${{ matrix.triple }}${{ matrix.ext }}"

      - name: Kiem chung weasyprint exe (PATH sach, nhu may nguoi dung)
        shell: bash
        run: |
          # set -x: vong v1.0.2 chi biet buoc fail chung chung (log chi tiet khoa
          # sau dang nhap); bat echo lenh de lan sau thay ngay lenh nao gay.
          set -x
          f="dist-tools/weasyprint-${{ matrix.triple }}${{ matrix.ext }}"
          ls -lh "$f"
          # PATH chi con thu muc he thong: neu exe con phu thuoc DLL GTK ngoai
          # (chua duoc dong vao onefile) thi buoc nay se do ngay tai CI.
          CLEAN_PATH="/c/Windows/System32:/c/Windows"
          PATH="$CLEAN_PATH" "$f" --version
          printf '<html><body><h1>test</h1><table><tr><td>1</td></tr></table></body></html>' > /tmp/t.html
          PATH="$CLEAN_PATH" "$f" /tmp/t.html /tmp/t.pdf
          ls -lh /tmp/t.pdf

      - name: Tao file .sha256
        shell: python
        run: |
          import hashlib, glob, os
          for f in glob.glob('dist-tools/*'):
              if f.endswith('.sha256'): continue
              h = hashlib.sha256(open(f, 'rb').read()).hexdigest()
              open(f + '.sha256', 'w').write(f"{h}  {os.path.basename(f)}\n")
              print(f, h)

      - uses: actions/upload-artifact@v7
        with:
          name: tools-${{ matrix.triple }}
          path: dist-tools/*
          if-no-files-found: warn

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Cai phu thuoc FE
        shell: bash
        working-directory: apps/web
        run: bun install
      - name: Chuan bi resources (Next standalone + bun sidecar)
        shell: bash
        run: bash scripts/prepare-resources.sh
      # Tim release user da tao truoc cho tag nay (neu co). tauri-action co
      # input releaseId: khi co releaseId thi no CHI upload asset vao release
      # do, khong tao moi, khong doi ten/body. De trong khi chua co release
      # thi roi ve luong cu (tagName + releaseDraft: tao draft).
      # Ly do bat buoc: o che do releaseDraft, tauri-action CHI tai su dung
      # draft cu; gap release da publish thi no bao "NOT a draft" roi co tao
      # moi va dap 422 (mot tag chi co mot release) — dung la truong hop
      # release v1.0.3 user tao truoc bang tay. Draft release thi khong lay
      # duoc qua API theo tag nen truong hop draft roi ve luong cu, va
      # tauri-action se tu tim thay draft do trong danh sach release.
      - name: Tim release theo tag
        id: find-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq .id 2>/dev/null || echo "")"
          echo "release-id=$id" >> "$GITHUB_OUTPUT"
          if [ -n "$id" ]; then echo "Dung release co san id=$id"; else echo "Chua co release cho tag — tauri-action se tao draft"; fi
      - name: Build Tauri + dang Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseId: ${{ steps.find-release.outputs.release-id }}
          releaseName: "HTML to PDF Demo ${{ github.ref_name }}"
          releaseDraft: true

  publish-tools:
    needs: tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tools-*
          merge-multiple: true
          path: dist-tools
      - name: Gan 2 exe cong cu + sha256 vao Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: tools-v1.0.0
          name: "Tools v1.0.0 (invoice-pdf + weasyprint)"
          draft: false
          files: dist-tools/*
